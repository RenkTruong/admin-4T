user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  upstream admin_backend {
    server admin:80;
  }

  upstream customer_backend {
    server customer:80;
  }

  upstream api_backend {
    server api:4000;
  }

  server {
    listen 80;
    server_name admin.4t-laundry.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 80;
    server_name customer.4t-laundry.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 80;
    server_name api.4t-laundry.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name admin.4t-laundry.com;

    ssl_certificate /etc/letsencrypt/live/admin.4t-laundry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.4t-laundry.com/privkey.pem;

    location / {
      proxy_pass http://admin_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 443 ssl http2;
    server_name customer.4t-laundry.com;

    ssl_certificate /etc/letsencrypt/live/customer.4t-laundry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customer.4t-laundry.com/privkey.pem;

    location / {
      proxy_pass http://customer_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 443 ssl http2;
    server_name api.4t-laundry.com;

    ssl_certificate /etc/letsencrypt/live/api.4t-laundry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.4t-laundry.com/privkey.pem;

    location / {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}
