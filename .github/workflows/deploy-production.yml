name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: API/package.json

      - name: Install API dependencies
        working-directory: API
        run: npm install

      - name: Validate API server file
        working-directory: API
        run: node --check server.js

  deploy:
    needs: validate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment credentials
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [ -n "$PROD_HOST" ] && [ -n "$PROD_USER" ] && [ -n "$PROD_SSH_KEY" ]; then
            echo "DEPLOY_READY=true" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_READY=false" >> "$GITHUB_ENV"
            echo "Missing deployment secrets; skipping SSH deploy."
          fi

      - name: Deploy to production server
        if: ${{ env.DEPLOY_READY == 'true' }}
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/4t || exit 1
            git pull origin main
            cp .env.production.example .env 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up --build -d
            docker compose -f docker-compose.prod.yml ps
