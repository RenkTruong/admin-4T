server {
  listen 80;
  server_name admin.4t-laundry.com customer.4t-laundry.com api.4t-laundry.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80 default_server;
  server_name _;
  return 404;
}
