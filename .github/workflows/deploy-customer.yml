name: Deploy Customer Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json

      - name: Install dependencies
        working-directory: apps/customer
        run: npm ci

      - name: Build customer frontend
        working-directory: apps/customer
        env:
          VITE_API_BASE_URL: https://api.4t-laundry.com
          VITE_APP_ENV: production
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: 'apps/customer/dist/**'
          target: '/var/www/customer-prod'
          strip_components: 3
